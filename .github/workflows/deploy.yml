
name: Deploy Tutor Portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Update npm
        run: npm install -g npm@11

        
      - name: Install dependencies
        run: npm install

      - name: Build website
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: npm run build -- --base="/${REPO_NAME}/"

      - name: Check build output
        run: |
           echo "Current directory:"
           pwd
           echo "Project files:"
           ls -la
           echo "Build directories:"
           find . -maxdepth 4 -name index.html -not -path "./node_modules/*"
           echo "Package build script:"
           npm pkg get scripts.build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      -

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
